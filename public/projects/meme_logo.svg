<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="meme-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%"  stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>

    <!-- White-to-slate gradient for text -->
    <linearGradient id="meme-text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="60%"  stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Soft white glow -->
    <filter id="meme-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.9
                1 0 0 0 0.9
                1 0 0 0 0.95
                0 0 0 0.4 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Top shine -->
    <linearGradient id="meme-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle white border gradient -->
    <linearGradient id="meme-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%"  stop-color="#94a3b8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="44" fill="url(#meme-bg)"/>

  <!-- Outer border -->
  <rect width="400" height="400" rx="44" fill="none" stroke="url(#meme-border)" stroke-width="1.5"/>

  <!-- Inner inset ring -->
  <rect x="12" y="12" width="376" height="376" rx="34" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Top shine overlay -->
  <rect width="400" height="200" rx="44" fill="url(#meme-shine)"/>

  <!-- Ambient white glow behind text -->
  <ellipse cx="200" cy="210" rx="130" ry="80" fill="#ffffff" fill-opacity="0.025"/>

  <!-- "ha" text lettermark -->
  <text
    x="200" y="262"
    font-family="Arial Black, Arial, sans-serif"
    font-size="155"
    font-weight="900"
    fill="url(#meme-text-grad)"
    text-anchor="middle"
    letter-spacing="-6"
    filter="url(#meme-glow)"
  >ha</text>

  <!-- Bottom accent lines -->
  <line x1="120" y1="322" x2="280" y2="322" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.12"/>
  <line x1="160" y1="322" x2="240" y2="322" stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.25"/>
</svg>
