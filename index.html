<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parth Prajapati | Cyber Security & AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.15) 1px, transparent 0);
      background-size: 32px 32px;
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(79, 70, 229, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }



    .glass-morphism {
      background: rgba(23, 37, 84, 0.7) !important;
      /* Deep Navy Blue */
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2) !important;
      /* Subtle blue border */
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .hud-line {
      position: fixed;
      background: rgba(255, 255, 255, 0.1);
      z-index: 10;
      pointer-events: none;
    }

    .hud-line-v {
      width: 1px;
      height: 100vh;
      top: 0;
    }

    .hud-line-h {
      height: 1px;
      width: 100vw;
      left: 0;
    }

    .coordinate-box {
      position: fixed;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      z-index: 100;
      pointer-events: none;
      font-weight: 800;
      opacity: 1;
      -webkit-font-smoothing: antialiased;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes scan {
      0% {
        transform: translateY(-100vh);
      }

      100% {
        transform: translateY(100vh);
      }
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.02), transparent);
      z-index: 5;
      pointer-events: none;
      animation: scan 8s linear infinite;
    }

    @keyframes blob {
      0% {
        transform: translate(0px, 0px) scale(1);
      }

      33% {
        transform: translate(30px, -50px) scale(1.1);
      }

      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }

      100% {
        transform: translate(0px, 0px) scale(1);
      }
    }

    .animate-blob {
      animation: blob 7s infinite;
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>

<body class="bg-[#020617] text-slate-100 antialiased overflow-x-hidden">

  <div class="scanline"></div>

  <!-- HUD Decorative elements -->
  <div class="coordinate-box top-[30%] left-6 -rotate-90 origin-left">SYSTEM_PROTOCOL: ONLINE</div>
  <div class="coordinate-box top-[60%] left-6 -translate-y-1/2 -rotate-90 origin-left">SECURITY_NODE: 7741.0x</div>
  <div class="coordinate-box bottom-20 left-6 -rotate-90 origin-left">ENCRYPT_KEY: 0xDEADBEEF</div>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>


</body>

</html>
